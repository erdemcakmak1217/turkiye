<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Türkiye Haritası</title>

<style>

body{
font-family:Arial;
text-align:center;
}
h2{
    position:relative;
    z-index:999;
}
#mapArea {
    display:flex;
    flex-direction:column; 
    align-items:center;
}

/* layout */

#container{
display:flex;
justify-content:center;
gap:40px;
align-items:flex-start;
}

/* sol panel */

#panel{
width:300px;
padding:15px;
text-align:left;
min-height:200px;
}

/* HARİTA KUTUSU */

#mapContainer{
position:relative;
width:900px;
overflow:hidden;
z-index:1;
}

/* svg */

svg{
width:900px;
}

/* iller */

path{
fill:#d9d9d9;
stroke:white;
stroke-width:1;
cursor:pointer;
transition:0.2s;
transform-box: fill-box;
transform-origin: center;
}

/* hover */

path:hover{
fill:aqua;
}

/* seçilen */

.selected{
fill:red !important;
animation: buyu 0.4s ease;
filter: drop-shadow(0px 0px 4px black);
}

@keyframes buyu{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* loading */

#loading{
display:none;
font-size:40px;
letter-spacing:8px;
}

.dot{
animation: blink 1.4s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes blink{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

/* zoom butonları */

#controls{
position:absolute;
right:10px;
bottom:10px;
display:flex;
flex-direction:column;
gap:2px;

z-index:999;
}

#controls button{
width:30px;
height:30px;
font-size:20px;
cursor:pointer;
}

/* ölçek */

#scale{
position:absolute;
left:10px;
bottom:10px;
background:white;
padding:5px 10px;
font-size:14px;

z-index:999;
}
#mapContainer{
    position:relative;
    width:900px;
    height:500px;      /* SABİT /*
    margin:auto;     
    border:2px black;   /* ÇERÇEVE FIX */
    overflow: hidden;
}

#harita{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    transform-origin:center;
    transition: transform 0.3s ease;
}
#harita{
    transform-origin: top left;
}

   
</style>

</head>

<body>

<div id="container">

<!-- SOL PANEL -->

<div id="panel">

<h3>İl Bilgisi</h3>

<div id="loading">
<span class="dot">•</span>
<span class="dot">•</span>
<span class="dot">•</span>
</div>

<div id="bilgi">
Bir il seçiniz
</div>

</div>

<script>

/* =========================
   İL SEÇME + WIKIPEDIA
========================= */

window.addEventListener("load", () => {

    let iller = document.querySelectorAll("path");

    iller.forEach(function(il){

        il.addEventListener("click", async function(){

            iller.forEach(i=>i.classList.remove("selected"));
            this.classList.add("selected");

            let ilAdi = this.id;

            document.getElementById("loading").style.display="block";
            document.getElementById("bilgi").innerHTML="";

            try{
                let response = await fetch(
                    "https://tr.wikipedia.org/api/rest_v1/page/summary/" + ilAdi
                );

                let data = await response.json();

                document.getElementById("loading").style.display="none";

                document.getElementById("bilgi").innerHTML = `
                    <h3>${ilAdi}</h3>
                    <p>${data.extract}</p>
                `;
            }
            catch{
                document.getElementById("bilgi").innerHTML="Bilgi alınamadı.";
            }

        });

    });

});


/* =========================
   İL SEÇME + WIKIPEDIA
========================= */

window.addEventListener("load", () => {

    let iller = document.querySelectorAll("path");

    iller.forEach(function(il){

        il.addEventListener("click", async function(){

            iller.forEach(i=>i.classList.remove("selected"));
            this.classList.add("selected");

            let ilAdi = this.id;

            document.getElementById("loading").style.display="block";
            document.getElementById("bilgi").innerHTML="";

            try{
                let response = await fetch(
                    "https://tr.wikipedia.org/api/rest_v1/page/summary/" + ilAdi
                );

                let data = await response.json();

                document.getElementById("loading").style.display="none";

                document.getElementById("bilgi").innerHTML = `
                    <h3>${ilAdi}</h3>
                    <p>${data.extract}</p>
                `;
            }
            catch{
                document.getElementById("bilgi").innerHTML="Bilgi alınamadı.";
            }

        });

    });

});


/* =========================
   ZOOM + PAN SİSTEMİ
========================= */

let stepIndex = 0;

let zoomLevels = [
1000000,900000,800000,700000,600000,
500000,400000,300000,200000,100000
];

let translateX = 0;
let translateY = 0;

const harita = document.getElementById("harita");
const mapContainer = document.getElementById("mapContainer");


/* =========================
   TRANSFORM + SINIR
========================= */

function applyTransform(){

    let base = 1000000;
    let scale = base / zoomLevels[stepIndex];

    const rect = mapContainer.getBoundingClientRect();

    const mapWidth = 900 * scale;
    const mapHeight = 600 * scale;

    const containerWidth = rect.width;
    const containerHeight = rect.height;

    let minX = containerWidth - mapWidth;
    let minY = containerHeight - mapHeight;

    let maxX = 0;
    let maxY = 0;

    translateX = Math.max(minX, Math.min(maxX, translateX));
    translateY = Math.max(minY, Math.min(maxY, translateY));

    harita.style.transform =
    `translate(${translateX}px, ${translateY}px) scale(${scale})`;

    updateScale(scale);
}


/* =========================
   BUTON ZOOM (MERKEZ ODAKLI)
========================= */

function zoomIn(){

    if(stepIndex >= zoomLevels.length - 1) return;

    const rect = mapContainer.getBoundingClientRect();

    let centerX = rect.width / 2;
    let centerY = rect.height / 2;

    let oldScale = 1000000 / zoomLevels[stepIndex];

    let worldX = (centerX - translateX) / oldScale;
    let worldY = (centerY - translateY) / oldScale;

    stepIndex++;

    let newScale = 1000000 / zoomLevels[stepIndex];

    translateX = centerX - worldX * newScale;
    translateY = centerY - worldY * newScale;

    applyTransform();
}


function zoomOut(){

    if(stepIndex <= 0) return;

    const rect = mapContainer.getBoundingClientRect();

    let centerX = rect.width / 2;
    let centerY = rect.height / 2;

    let oldScale = 1000000 / zoomLevels[stepIndex];

    let worldX = (centerX - translateX) / oldScale;
    let worldY = (centerY - translateY) / oldScale;

    stepIndex--;

    let newScale = 1000000 / zoomLevels[stepIndex];

    translateX = centerX - worldX * newScale;
    translateY = centerY - worldY * newScale;

    applyTransform();
}


/* =========================
   SCROLL ZOOM (MOUSE ODAKLI)
========================= */

mapContainer.addEventListener("wheel", (e) => {

    e.preventDefault();

    const rect = mapContainer.getBoundingClientRect();

    let mouseX = e.clientX - rect.left;
    let mouseY = e.clientY - rect.top;

    let oldScale = 1000000 / zoomLevels[stepIndex];

    let worldX = (mouseX - translateX) / oldScale;
    let worldY = (mouseY - translateY) / oldScale;

    if(e.deltaY < 0){
        if(stepIndex < zoomLevels.length - 1){
            stepIndex++;
        }
    } else {
        if(stepIndex > 0){
            stepIndex--;
        }
    }

    let newScale = 1000000 / zoomLevels[stepIndex];

    translateX = mouseX - worldX * newScale;
    translateY = mouseY - worldY * newScale;

    applyTransform();
});


/* =========================
   MOUSE DRAG (PAN)
========================= */

let isDragging = false;
let startX, startY;

harita.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
    harita.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if(!isDragging) return;

    translateX = e.clientX - startX;
    translateY = e.clientY - startY;

    applyTransform();
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    harita.style.cursor = "grab";
});

harita.style.cursor = "grab";


/* =========================
   SCALE
========================= */

function updateScale(scale){

    let base = 1000000;

    let currentScale = Math.round(base / scale);

    document.getElementById("scale").innerText =
    "1 / " + currentScale.toLocaleString("tr-TR");
}
</script>
